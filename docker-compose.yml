services:
  postgres:
    image: postgres:17
    container_name: atelie-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atelie_os
      POSTGRES_USER: atelie
      POSTGRES_PASSWORD: atelie
    ports:
      - "5432:5432"
    volumes:
      - atelie_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelie -d atelie_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atelie_os_postgres_data:
